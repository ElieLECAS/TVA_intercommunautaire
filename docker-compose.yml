services:
  postgres:
    image: postgres:16
    container_name: tva_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tva}
      POSTGRES_DB: ${POSTGRES_DB:-tva_referentiel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tva}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
